[project]
name = "azure-durable-pipeline"
version = "0.1.0"
description = "Directory enrichment on Azure Durable Functions, with Terraform infrastructure, verified locally"
requires-python = ">=3.11,<3.13"
dependencies = [
    "azure-functions>=1.21",
    "azure-functions-durable>=1.2.10",
    "azure-storage-blob>=12.23",
    "azure-data-tables>=12.5",
    "azure-servicebus>=7.12",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "selectolax>=0.3.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "ruff>=0.7",
    "respx>=0.21",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/azure_pipeline"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 180
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["bin", ".azurite", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]
